<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Verify Identity | Unified Healthcare</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec13",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102210",
                        "neumorphic-bg": "#f0f4f0",
                        "neumorphic-shadow-dark": "#d1d9d1",
                        "neumorphic-shadow-light": "#ffffff",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    boxShadow: {
                        'neumorphic-flat': '8px 8px 16px #d1d9d1, -8px -8px 16px #ffffff',
                        'neumorphic-inset': 'inset 6px 6px 12px #d1d9d1, inset -6px -6px 12px #ffffff',
                        'primary-glow': '0 0 20px rgba(19, 236, 19, 0.4), 8px 8px 16px #d1d9d1',
                    }
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        body {
            font-family: 'Manrope', sans-serif;
        }
        .neumorphic-card {
            background: #f0f4f0;
            box-shadow: 20px 20px 60px #d1d9d1, -20px -20px 60px #ffffff;
        }
        .neumorphic-field-otp {
            background: #f0f4f0;
            box-shadow: inset 4px 4px 8px #d1d9d1, inset -4px -4px 8px #ffffff;
        }
        .neumorphic-button-primary {
            background: #13ec13;
            box-shadow: 6px 6px 12px #d1d9d1, -6px -6px 12px #ffffff, 0 0 20px rgba(19, 236, 19, 0.3);
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col font-display transition-colors duration-300">
<header class="w-full px-6 py-4 md:px-20 lg:px-40">
<div class="flex items-center justify-between max-w-[1200px] mx-auto">
<div class="flex items-center gap-3">
<div class="w-10 h-10 bg-primary flex items-center justify-center rounded-xl shadow-lg">
<span class="material-symbols-outlined text-white text-2xl">health_metrics</span>
</div>
<h1 class="text-xl font-extrabold tracking-tight text-background-dark dark:text-white">Unified Healthcare</h1>
</div>
<nav class="hidden md:flex items-center gap-10">
<a class="text-sm font-semibold text-gray-600 hover:text-primary transition-colors" href="#">Home</a>
<a class="text-sm font-semibold text-gray-600 hover:text-primary transition-colors" href="#">Support</a>
<button class="bg-white border border-gray-100 text-background-dark px-6 py-2.5 rounded-full font-bold text-sm shadow-sm hover:scale-105 transition-transform active:scale-95">
                Register
            </button>
</nav>
</div>
</header>
<main class="flex-1 flex items-center justify-center p-6 relative overflow-hidden">
<div class="absolute top-1/4 left-1/4 w-64 h-64 bg-primary/10 rounded-full blur-3xl -z-10"></div>
<div class="absolute bottom-1/4 right-1/4 w-80 h-80 bg-primary/5 rounded-full blur-3xl -z-10"></div>
<div class="w-full max-w-[520px] neumorphic-card rounded-3xl p-10 md:p-14 border border-white/20">
<div class="text-center mb-10">
<div class="w-16 h-16 bg-white/50 rounded-full flex items-center justify-center mx-auto mb-6 shadow-neumorphic-flat">
<span class="material-symbols-outlined text-primary text-3xl">verified_user</span>
</div>
<h2 class="text-3xl font-extrabold text-background-dark mb-3 tracking-tight">Verify Your Identity</h2>
<p class="text-gray-500 text-sm font-medium px-4 max-w-[320px] mx-auto">We've sent a 6-digit code to your email.</p>
</div>
<form class="space-y-10">
<div class="flex justify-between items-center gap-2 md:gap-4">
<input autofocus="" class="w-12 h-14 md:w-14 md:h-16 text-center text-2xl font-bold neumorphic-field-otp rounded-xl border-none focus:ring-2 focus:ring-primary/50 text-background-dark outline-none transition-all" maxlength="1" type="text"/>
<input class="w-12 h-14 md:w-14 md:h-16 text-center text-2xl font-bold neumorphic-field-otp rounded-xl border-none focus:ring-2 focus:ring-primary/50 text-background-dark outline-none transition-all" maxlength="1" type="text"/>
<input class="w-12 h-14 md:w-14 md:h-16 text-center text-2xl font-bold neumorphic-field-otp rounded-xl border-none focus:ring-2 focus:ring-primary/50 text-background-dark outline-none transition-all" maxlength="1" type="text"/>
<input class="w-12 h-14 md:w-14 md:h-16 text-center text-2xl font-bold neumorphic-field-otp rounded-xl border-none focus:ring-2 focus:ring-primary/50 text-background-dark outline-none transition-all" maxlength="1" type="text"/>
<input class="w-12 h-14 md:w-14 md:h-16 text-center text-2xl font-bold neumorphic-field-otp rounded-xl border-none focus:ring-2 focus:ring-primary/50 text-background-dark outline-none transition-all" maxlength="1" type="text"/>
<input class="w-12 h-14 md:w-14 md:h-16 text-center text-2xl font-bold neumorphic-field-otp rounded-xl border-none focus:ring-2 focus:ring-primary/50 text-background-dark outline-none transition-all" maxlength="1" type="text"/>
</div>
<div class="pt-4">
<button class="w-full neumorphic-button-primary h-14 rounded-full text-white font-extrabold text-lg shadow-primary-glow hover:brightness-110 active:scale-[0.98] transition-all duration-200" type="submit">
                    Verify &amp; Continue
                </button>
</div>
</form>
<div class="mt-10 text-center flex flex-col gap-4">
<p class="text-sm font-medium text-gray-400">Didn't receive the code?</p>
<a class="inline-flex items-center justify-center gap-2 text-sm font-bold text-primary hover:underline transition-all" href="#">
                Resend Code
            </a>
</div>
</div>
</main>
<footer class="py-10 text-center">
<p class="text-xs text-gray-400 font-medium tracking-wide">
        © 2024 Unified Healthcare Management. Certified &amp; Secure.
    </p>
</footer>

</body></html>
