<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Reset Password | Unified Healthcare</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec13",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102210",
                        "neumorphic-bg": "#f0f4f0",
                        "neumorphic-shadow-dark": "#d1d9d1",
                        "neumorphic-shadow-light": "#ffffff",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    boxShadow: {
                        'neumorphic-flat': '8px 8px 16px #d1d9d1, -8px -8px 16px #ffffff',
                        'neumorphic-inset': 'inset 6px 6px 12px #d1d9d1, inset -6px -6px 12px #ffffff',
                        'primary-glow': '0 0 20px rgba(19, 236, 19, 0.4), 8px 8px 16px #d1d9d1',
                    }
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        body {
            font-family: 'Manrope', sans-serif;
        }
        .neumorphic-card {
            background: #f0f4f0;
            box-shadow: 20px 20px 60px #d1d9d1, -20px -20px 60px #ffffff;
        }
        .neumorphic-field {
            background: #f0f4f0;
            box-shadow: inset 6px 6px 12px #d1d9d1, inset -6px -6px 12px #ffffff;
        }
        .strength-meter-segment {
            height: 4px;
            border-radius: 2px;
            background: #e2e8f0;
            flex: 1;
        }
        .strength-active {
            background: #13ec13;
            box-shadow: 0 0 8px rgba(19, 236, 19, 0.5);
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col font-display transition-colors duration-300">
<header class="w-full px-6 py-4 md:px-20 lg:px-40">
<div class="flex items-center justify-between max-w-[1200px] mx-auto">
<div class="flex items-center gap-3">
<div class="w-10 h-10 bg-primary flex items-center justify-center rounded-xl shadow-lg">
<span class="material-symbols-outlined text-white text-2xl">health_metrics</span>
</div>
<h1 class="text-xl font-extrabold tracking-tight text-background-dark dark:text-white">Unified Healthcare</h1>
</div>
<nav class="hidden md:flex items-center gap-10">
<a class="text-sm font-semibold text-gray-600 hover:text-primary transition-colors" href="#">Home</a>
<a class="text-sm font-semibold text-gray-600 hover:text-primary transition-colors" href="#">Support</a>
<button class="bg-primary text-background-dark px-6 py-2.5 rounded-full font-bold text-sm shadow-md hover:scale-105 transition-transform active:scale-95">
                    Register
                </button>
</nav>
</div>
</header>
<main class="flex-1 flex items-center justify-center p-6 relative">
<div class="absolute top-1/4 left-1/4 w-64 h-64 bg-primary/10 rounded-full blur-3xl -z-10"></div>
<div class="absolute bottom-1/4 right-1/4 w-80 h-80 bg-primary/5 rounded-full blur-3xl -z-10"></div>
<div class="w-full max-w-[480px] neumorphic-card rounded-xl p-10 md:p-14 border border-white/20">
<div class="text-center mb-10">
<div class="w-16 h-16 bg-white/50 rounded-full flex items-center justify-center mx-auto mb-6 shadow-neumorphic-flat">
<span class="material-symbols-outlined text-primary text-3xl">key</span>
</div>
<h2 class="text-3xl font-extrabold text-background-dark mb-3">Reset Password</h2>
<p class="text-gray-500 text-sm font-medium px-4">Enter your new password below.</p>
</div>
<form class="space-y-6">
<div class="flex flex-col gap-2">
<label class="text-sm font-bold text-gray-700 ml-2">New Password</label>
<div class="neumorphic-field rounded-2xl flex items-center px-5 h-14">
<span class="material-symbols-outlined text-gray-400 mr-3">lock</span>
<input class="bg-transparent border-none focus:ring-0 w-full text-background-dark placeholder:text-gray-400 font-medium" placeholder="Create new password" type="password"/>
<button class="text-gray-400 hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<div class="px-2">
<div class="flex gap-2 mb-2">
<div class="strength-meter-segment strength-active"></div>
<div class="strength-meter-segment strength-active"></div>
<div class="strength-meter-segment strength-active"></div>
<div class="strength-meter-segment"></div>
</div>
<p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Password Strength: Strong</p>
</div>
<div class="flex flex-col gap-2">
<label class="text-sm font-bold text-gray-700 ml-2">Confirm New Password</label>
<div class="neumorphic-field rounded-2xl flex items-center px-5 h-14">
<span class="material-symbols-outlined text-gray-400 mr-3">lock_reset</span>
<input class="bg-transparent border-none focus:ring-0 w-full text-background-dark placeholder:text-gray-400 font-medium" placeholder="Repeat new password" type="password"/>
<button class="text-gray-400 hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<div class="pt-6">
<button class="w-full bg-primary h-14 rounded-full text-white font-extrabold text-lg shadow-primary-glow hover:brightness-110 active:scale-95 transition-all duration-200" type="submit">
                        Update Password
                    </button>
</div>
</form>
<div class="mt-10 text-center">
<a class="inline-flex items-center gap-2 text-sm font-bold text-gray-500 hover:text-primary transition-colors group" href="#">
<span class="material-symbols-outlined text-lg group-hover:-translate-x-1 transition-transform">arrow_back</span>
                    Back to Log in
                </a>
</div>
</div>
</main>
<footer class="py-10 text-center">
<p class="text-xs text-gray-400 font-medium">
            © 2024 Unified Healthcare Management. Certified &amp; Secure.
        </p>
</footer>

</body></html>
