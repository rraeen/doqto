<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>HealSoft - Patient Dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'bg-color': '#f0f3f5',
            'brand-green': '#00d220',
            'brand-green-light': '#e6fce9',
            'brand-dark': '#1a202c',
            'brand-gray': '#718096',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          boxShadow: {
            'neo-outer': '8px 8px 16px #d1d9e6, -8px -8px 16px #ffffff',
            'neo-inner': 'inset 8px 8px 16px #d1d9e6, inset -8px -8px 16px #ffffff',
            'neo-button': '5px 5px 10px #d1d9e6, -5px -5px 10px #ffffff',
            'neo-button-pressed': 'inset 5px 5px 10px #d1d9e6, inset -5px -5px 10px #ffffff',
            'neo-nav': '0px -5px 20px rgba(0,0,0,0.05)',
          }
        }
      }
    }
  </script>
<style data-purpose="custom-fonts">
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f0f3f5;
      -webkit-font-smoothing: antialiased;
    }
    
    /* Hide scrollbar for clean app look */
    ::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body class="bg-bg-color text-brand-dark min-h-screen pb-24 flex justify-center">
<!-- Mobile App Container -->
<div class="w-full max-w-md bg-bg-color min-h-screen relative overflow-hidden shadow-2xl sm:border sm:border-gray-200">
<!-- Main Content Area -->
<main class="p-6">
<!-- BEGIN: HeaderSection -->
<header class="flex justify-between items-center mb-8" data-purpose="app-header">
<!-- Logo -->
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-brand-green flex items-center justify-center shadow-neo-button">
<i class="fa-solid fa-layer-group text-white text-lg"></i>
</div>
<h1 class="text-xl font-bold tracking-tight text-brand-dark">HealSoft</h1>
</div>
<!-- User Actions -->
<div class="flex items-center gap-4">
<!-- Notification Bell -->
<button class="w-10 h-10 rounded-full bg-bg-color flex items-center justify-center shadow-neo-outer hover:shadow-neo-inner transition-shadow text-brand-gray">
<i class="fa-solid fa-bell"></i>
</button>
<!-- User Avatar -->
<div class="w-10 h-10 rounded-full border-2 border-white shadow-neo-outer overflow-hidden">
<img alt="User Profile" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCG4s-RPpzT0Q8erk9lYYJmQzkVybuhlqxx4rYBf0t6yAiDCUcePJ6OTMbEq34ux8xYW-V7K0U-mBZY-rn7_UNA1EKaVzqSaO-O8IAR2rIJqqGYJfgnRQflZjImpafVQdmjZaabGkzYOtXa2-oMQ81TbeTNMF3Kkt_J4Lp-bO_KFFuYXHUxEiXzn0-apDRZEWzhUaWY_cbMy19jvym0vglde9GYD5BpEgQtOZaOkatqaKeWjMyPdwArCpUIQdRW1BQLVWWKBBl1hTmD"/>
</div>
</div>
</header>
<!-- END: HeaderSection -->
<!-- BEGIN: GreetingSection -->
<section class="mb-6" data-purpose="greeting">
<h2 class="text-3xl font-bold mb-6 text-brand-dark tracking-tight">Good morning, Raunak</h2>
<!-- Search Bar -->
<div class="relative shadow-neo-inner rounded-full bg-bg-color flex items-center px-5 py-4">
<i class="fa-solid fa-magnifying-glass text-brand-green mr-3 text-lg"></i>
<input class="bg-transparent border-none focus:ring-0 text-brand-gray placeholder-brand-gray/60 w-full text-[15px] outline-none" placeholder="Search by name, specialty, or hospital..." type="text"/>
</div>
</section>
<!-- END: GreetingSection -->
<!-- BEGIN: AppointmentCard -->
<section class="mb-8" data-purpose="upcoming-appointment">
<div class="bg-bg-color rounded-3xl p-4 shadow-neo-outer flex gap-4 items-center">
<!-- Doctor Image -->
<div class="w-1/3 aspect-[4/5] rounded-2xl overflow-hidden bg-teal-100 flex-shrink-0 relative">
<img alt="Dr. Sarah Jenkins" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDT9lBerBTIJ1an85XguyP_juLRRZ9d3AvJX9hLYZp4ZkM9U6Uhu9uInEhSh6cRuYp1t-25U3p-yIBXiS38mgiLZk4eSrjbfEwTBgPDnClEnT03WFCXoW3keZ_hyNbAcmo005PijclTQvzp2n460EbUNK-2Xl23S9PB-p1qNedWpfnaM62iSsknd_MdiJliYIe9JmIDz8MX1Fwu1C7EHK572MwwNLne7xKPD4MoyTh6R0Njoh6uuYwQcH-CPzxlYsPmGecgP4FAKu_Z"/>
</div>
<!-- Appointment Details -->
<div class="flex-grow py-2">
<div class="flex justify-between items-start mb-1">
<span class="text-sm font-semibold text-brand-dark">Upcoming Appointment</span>
<span class="text-xs text-brand-gray font-medium">Tomorrow</span>
</div>
<p class="text-xs text-brand-green font-medium mb-1">Primary Physician</p>
<h3 class="text-xl font-bold text-brand-dark mb-2">Dr. Sarah Jenkins</h3>
<p class="text-xs text-brand-gray flex items-center gap-1.5 mb-4 font-medium">
<i class="fa-regular fa-clock"></i> 10:30 AM — Video Call
            </p>
<!-- Action Button -->
<button class="w-full bg-brand-green text-white font-semibold py-3 px-4 rounded-xl flex items-center justify-center gap-2 shadow-lg shadow-brand-green/30 hover:bg-green-600 transition-colors">
<i class="fa-solid fa-video"></i> Join Consultation
            </button>
</div>
</div>
</section>
<!-- END: AppointmentCard -->
<!-- BEGIN: QuickActions -->
<section class="grid grid-cols-2 gap-4 mb-10" data-purpose="quick-actions">
<!-- Action 1 -->
<button class="bg-bg-color rounded-2xl py-5 px-4 shadow-neo-outer flex items-center gap-4 hover:shadow-neo-inner transition-shadow active:shadow-neo-inner">
<div class="w-10 h-10 rounded-full bg-brand-green-light flex items-center justify-center text-brand-green shrink-0">
<i class="fa-regular fa-calendar-check text-lg"></i>
</div>
<span class="font-semibold text-brand-dark text-base">Book Visit</span>
</button>
<!-- Action 2 -->
<button class="bg-bg-color rounded-2xl py-5 px-4 shadow-neo-outer flex items-center gap-4 hover:shadow-neo-inner transition-shadow active:shadow-neo-inner">
<div class="w-10 h-10 rounded-full bg-brand-green-light flex items-center justify-center text-brand-green shrink-0">
<i class="fa-regular fa-file-lines text-lg"></i>
</div>
<span class="font-semibold text-brand-dark text-base">Records</span>
</button>
<!-- Action 3 -->
<button class="bg-bg-color rounded-2xl py-5 px-4 shadow-neo-outer flex items-center gap-4 hover:shadow-neo-inner transition-shadow active:shadow-neo-inner">
<div class="w-10 h-10 rounded-full bg-brand-green-light flex items-center justify-center text-brand-green shrink-0">
<i class="fa-regular fa-message text-lg"></i>
</div>
<span class="font-semibold text-brand-dark text-base">Chat</span>
</button>
<!-- Action 4 -->
<button class="bg-bg-color rounded-2xl py-5 px-4 shadow-neo-outer flex items-center gap-4 hover:shadow-neo-inner transition-shadow active:shadow-neo-inner">
<div class="w-10 h-10 rounded-full bg-brand-green-light flex items-center justify-center text-brand-green shrink-0">
<i class="fa-solid fa-plus text-lg"></i>
</div>
<span class="font-semibold text-brand-dark text-base">Prescriptions</span>
</button>
</section>
<!-- END: QuickActions -->
<!-- BEGIN: HealthSnapshot -->
<section data-purpose="health-snapshot">
<div class="flex items-center gap-2 mb-4">
<i class="fa-solid fa-chart-simple text-brand-green text-lg"></i>
<h3 class="text-xl font-bold text-brand-dark tracking-tight">Health Snapshot</h3>
</div>
<div class="flex gap-4 overflow-x-auto pb-4 -mx-6 px-6 snap-x">
<!-- Vitals Card -->
<div class="bg-bg-color rounded-3xl p-5 shadow-neo-outer min-w-[160px] flex-shrink-0 snap-start relative">
<div class="flex justify-between items-start mb-6">
<span class="text-sm text-brand-gray font-medium">Latest Vitals</span>
<i class="fa-solid fa-heart text-brand-green"></i>
</div>
<div class="flex items-baseline gap-1">
<span class="text-4xl font-bold text-brand-dark">72</span>
<span class="text-xs text-brand-gray font-medium uppercase">BPM</span>
</div>
</div>
<!-- Reminders Card -->
<div class="bg-bg-color rounded-3xl p-5 shadow-neo-outer min-w-[240px] flex-shrink-0 snap-start relative flex flex-col justify-between">
<div class="flex justify-between items-start mb-4">
<span class="text-sm text-brand-gray font-medium">Reminders</span>
<i class="fa-solid fa-chevron-right text-brand-gray"></i>
</div>
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-brand-green-light flex items-center justify-center text-brand-green shrink-0">
<i class="fa-solid fa-pills text-lg"></i>
</div>
<div>
<h4 class="text-sm font-bold text-brand-dark">Medication Reminder</h4>
<p class="text-xs text-brand-gray">Vitamin D3 - 2000 IU</p>
</div>
</div>
</div>
</div>
</section>
<!-- END: HealthSnapshot -->
</main>
<!-- BEGIN: BottomNav -->
<nav class="absolute bottom-6 left-6 right-6 bg-white rounded-full shadow-xl flex justify-between items-center px-6 py-4 z-50 border border-gray-100" data-purpose="bottom-navigation">
<a class="flex flex-col items-center gap-1 text-brand-green" href="#">
<i class="fa-solid fa-house text-xl mb-1"></i>
<span class="text-[10px] font-bold tracking-wider">HOME</span>
</a>
<a class="flex flex-col items-center gap-1 text-brand-gray hover:text-brand-dark transition-colors" href="#">
<i class="fa-regular fa-calendar text-xl mb-1"></i>
<span class="text-[10px] font-semibold tracking-wider">VISITS</span>
</a>
<a class="flex flex-col items-center gap-1 text-brand-gray hover:text-brand-dark transition-colors" href="#">
<i class="fa-regular fa-folder-open text-xl mb-1"></i>
<span class="text-[10px] font-semibold tracking-wider">RECORDS</span>
</a>
<a class="flex flex-col items-center gap-1 text-brand-gray hover:text-brand-dark transition-colors" href="#">
<i class="fa-regular fa-envelope text-xl mb-1"></i>
<span class="text-[10px] font-semibold tracking-wider">MAIL</span>
</a>
<a class="flex flex-col items-center gap-1 text-brand-gray hover:text-brand-dark transition-colors" href="#">
<i class="fa-regular fa-user text-xl mb-1"></i>
<span class="text-[10px] font-semibold tracking-wider">PROFILE</span>
</a>
</nav>
<!-- END: BottomNav -->
</div>
</body></html>
